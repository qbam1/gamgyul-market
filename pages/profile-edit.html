<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 수정</title>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/page.css">
</head>
<body class="page">

  <div class="app">

    <!-- 헤더 -->
    <header class="top-header">

      <div class="top-header__left">
        <button class="icon-btn" type="button" onclick="history.back()" aria-label="뒤로가기">
          <img src="../assets/icons/icon-arrow-left.svg" alt="">
        </button>
      </div>

      <h1 class="top-header__title">프로필 수정</h1>

      <div class="top-header__right">
        <button class="profile-save-btn" id="saveBtn" type="button">저장</button>
      </div>

    </header>

    <main class="profile-edit-page">

      <!-- 프로필 이미지 -->
      <section class="profile-edit-avatar">
        <div class="profile-edit-avatar__wrap">
          <img
            id="previewImg"
            class="profile-edit-avatar__img"
            src="../assets/logo/symbol-logo.png"
            alt="프로필 이미지"
          >
          <label class="profile-edit-avatar__label" for="profileImageInput">
            <img src="../assets/icons/icon-image.svg" alt="">
          </label>
          <input id="profileImageInput" type="file" accept="image/*" hidden>
        </div>
      </section>

      <!-- 입력 폼 -->
      <section class="profile-edit-form">
        <div class="profile-edit-field">
          <label class="profile-edit-label" for="usernameInput">사용자 이름</label>
          <input id="usernameInput" class="profile-edit-input" type="text" placeholder="2~10자 이내여야 합니다.">
          <p class="profile-edit-error" id="usernameError"></p>
        </div>

        <div class="profile-edit-field">
          <label class="profile-edit-label" for="accountInput">계정 ID</label>
          <input id="accountInput" class="profile-edit-input" type="text" placeholder="영문, 숫자, 밑줄 및 마침표만 사용 가능합니다.">
          <p class="profile-edit-error" id="accountError"></p>
        </div>

        <div class="profile-edit-field">
          <label class="profile-edit-label" for="introInput">소개</label>
          <input id="introInput" class="profile-edit-input" type="text" placeholder="자신과 판매할 상품에 대해 소개해 주세요!">
        </div>
      </section>

    </main>

  </div>

  <script src="../js/api.js"></script>

  <script>
    const previewImg = document.getElementById("previewImg");
    const profileImageInput = document.getElementById("profileImageInput");
    const usernameInput = document.getElementById("usernameInput");
    const accountInput = document.getElementById("accountInput");
    const introInput = document.getElementById("introInput");
    const saveBtn = document.getElementById("saveBtn");

    const usernameError = document.getElementById("usernameError");
    const accountError = document.getElementById("accountError");

    let uploadedImageUrl = "";

    function validateForm() {
      let valid = true;

      usernameError.textContent = "";
      accountError.textContent = "";

      const username = usernameInput.value.trim();
      const account = accountInput.value.trim();

      if (username.length < 2 || username.length > 10) {
        usernameError.textContent = "사용자 이름은 2자 이상 10자 이하로 입력해주세요.";
        valid = false;
      }

      const accountRegex = /^[A-Za-z0-9._]+$/;
      if (!accountRegex.test(account)) {
        accountError.textContent = "계정 ID는 영문, 숫자, 밑줄 및 마침표만 사용할 수 있습니다.";
        valid = false;
      }

      if (valid) {
        saveBtn.classList.add("profile-save-btn--active");
      } else {
        saveBtn.classList.remove("profile-save-btn--active");
      }

      return valid;
    }

    usernameInput.addEventListener("input", validateForm);
    accountInput.addEventListener("input", validateForm);

    profileImageInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        previewImg.src = reader.result;
      };
      reader.readAsDataURL(file);

      try {
        const uploaded = await uploadImage(file);
        uploadedImageUrl = uploaded;
      } catch (error) {
        console.error(error);
      }
    });

    async function loadMyInfo() {
      try {
        const res = await apiRequest("/user/myinfo", {
          method: "GET",
          auth: true
        });

        const user = res.user;
        previewImg.src = user.image || "../assets/logo/symbol-logo.png";
        uploadedImageUrl = user.image || "";
        usernameInput.value = user.username || "";
        accountInput.value = user.accountname || "";
        introInput.value = user.intro || "";

        validateForm();
      } catch (error) {
        console.error(error);
      }
    }

    saveBtn.addEventListener("click", async () => {
      if (!validateForm()) return;

      try {
        await apiRequest("/user", {
          method: "PUT",
          auth: true,
          body: {
            user: {
              username: usernameInput.value.trim(),
              accountname: accountInput.value.trim(),
              intro: introInput.value.trim(),
              image: uploadedImageUrl
            }
          }
        });

        location.href = "./profile.html";
      } catch (error) {
        console.error(error);
      }
    });

    loadMyInfo();
  </script>

</body>
</html>
