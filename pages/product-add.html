<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록</title>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/page.css">
</head>
<body class="page">

  <div class="app">

    <!-- 헤더 -->
    <header class="top-header">

      <div class="top-header__left">
        <button class="icon-btn" type="button" onclick="history.back()" aria-label="뒤로가기">
          <img src="../assets/icons/icon-arrow-left.svg" alt="">
        </button>
      </div>

      <h1 class="top-header__title">상품 등록</h1>

      <div class="top-header__right">
        <button class="product-save-btn" id="saveBtn" type="button">저장</button>
      </div>

    </header>

    <main class="product-add-page">

      <!-- 상품 이미지 -->
      <section class="product-add-image">
        <div class="product-add-image__wrap">
          <img
            id="productPreview"
            class="product-add-image__img"
            src="../assets/logo/symbol-logo.png"
            alt="상품 이미지"
          >

          <label class="product-add-image__label" for="productImageInput">
            <img src="../assets/icons/icon-image.svg" alt="">
          </label>

          <input id="productImageInput" type="file" accept="image/*" hidden>
        </div>
      </section>

      <!-- 입력폼 -->
      <section class="product-add-form">

        <div class="product-add-field">
          <label class="product-add-label" for="itemNameInput">상품명</label>
          <input id="itemNameInput" class="product-add-input" type="text" placeholder="2~15자 이내여야 합니다.">
          <p class="product-add-error" id="itemNameError"></p>
        </div>

        <div class="product-add-field">
          <label class="product-add-label" for="priceInput">가격</label>
          <input id="priceInput" class="product-add-input" type="text" inputmode="numeric" placeholder="숫자만 입력 가능합니다.">
          <p class="product-add-error" id="priceError"></p>
        </div>

        <div class="product-add-field">
          <label class="product-add-label" for="linkInput">판매 링크</label>
          <input id="linkInput" class="product-add-input" type="text" placeholder="URL을 입력해 주세요.">
          <p class="product-add-error" id="linkError"></p>
        </div>

      </section>

    </main>

  </div>

  <script src="../js/api.js"></script>

  <script>
    const productPreview = document.getElementById("productPreview");
    const productImageInput = document.getElementById("productImageInput");
    const itemNameInput = document.getElementById("itemNameInput");
    const priceInput = document.getElementById("priceInput");
    const linkInput = document.getElementById("linkInput");
    const saveBtn = document.getElementById("saveBtn");

    const itemNameError = document.getElementById("itemNameError");
    const priceError = document.getElementById("priceError");
    const linkError = document.getElementById("linkError");

    let uploadedImageUrl = "";

    function validateForm() {
      let valid = true;

      itemNameError.textContent = "";
      priceError.textContent = "";
      linkError.textContent = "";

      const itemName = itemNameInput.value.trim();
      const price = priceInput.value.replace(/,/g, "").trim();
      const link = linkInput.value.trim();

      if (itemName.length < 2 || itemName.length > 15) {
        itemNameError.textContent = "상품명은 2자 이상 15자 이하로 입력해주세요.";
        valid = false;
      }

      if (!/^[0-9]+$/.test(price)) {
        priceError.textContent = "가격은 숫자만 입력 가능합니다.";
        valid = false;
      }

      if (!/^https?:\/\/.+/.test(link)) {
        linkError.textContent = "올바른 URL 형식을 입력해주세요.";
        valid = false;
      }

      if (!uploadedImageUrl) {
        valid = false;
      }

      if (valid) {
        saveBtn.classList.add("product-save-btn--active");
      } else {
        saveBtn.classList.remove("product-save-btn--active");
      }

      return valid;
    }

    itemNameInput.addEventListener("input", validateForm);

    priceInput.addEventListener("input", () => {
      const onlyNumber = priceInput.value.replace(/[^0-9]/g, "");
      if (onlyNumber) {
        priceInput.value = Number(onlyNumber).toLocaleString("ko-KR");
      } else {
        priceInput.value = "";
      }
      validateForm();
    });

    linkInput.addEventListener("input", validateForm);

    productImageInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        productPreview.src = reader.result;
      };
      reader.readAsDataURL(file);

      try {
        const uploaded = await uploadImage(file);
        uploadedImageUrl = uploaded;
      } catch (error) {
        console.error(error);
      }

      validateForm();
    });

    saveBtn.addEventListener("click", async () => {
      if (!validateForm()) return;

      try {
        await apiRequest("/product", {
          method: "POST",
          auth: true,
          body: {
            product: {
              itemName: itemNameInput.value.trim(),
              price: Number(priceInput.value.replace(/,/g, "")),
              link: linkInput.value.trim(),
              itemImage: uploadedImageUrl
            }
          }
        });

        location.href = "./profile.html";
      } catch (error) {
        console.error(error);
      }
    });
  </script>

</body>
</html>
